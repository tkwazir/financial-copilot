version: 2

models:
  - name: stg_market_prices
    description: Cleaned, deduped daily OHLCV prices from RAW.
    columns:
      - name: ticker
        tests: [not_null]
      - name: price_date
        tests: [not_null]

  - name: stg_tickers
    description: Cleaned, deduped ticker reference data from RAW.
    columns:
      - name: ticker
        tests: [not_null, unique]

  - name: stg_transactions
    description: Cleaned, deduped transaction records from RAW.
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]

  - name: stg_accounts
    description: Cleaned, deduped account records from RAW.
    columns:
      - name: account_id
        tests: [not_null, unique]
